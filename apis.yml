aid: prizeo
name: Prizeo
description: >-
  Prizeo is a charity fundraising platform that runs celebrity-driven online
  sweepstakes: supporters donate as little as $10 to a participating cause to be
  entered for a chance to win once-in-a-lifetime experiences and prizes with
  well-known names in music, sports, and entertainment. Campaigns run on behalf
  of charities and celebrity partners, donations are processed online (Stripe and
  PayPal), and winners are selected by raffle under published official rules.
  Prizeo operates as part of the Charity Network family of fundraising brands
  (alongside Charitybuzz) and was backed by Battery Ventures. It is a
  consumer-facing web application; the /api/v1 and /api/v2 endpoints observed on
  the site are private backends for its own React frontend rather than a
  documented, public developer API — there is no developer portal, OpenAPI, SDKs,
  or public API program.
